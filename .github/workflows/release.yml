name: Build Release Installers

# 打 v* 标签时自动构建,或手动 workflow_dispatch 为指定 Release 补包
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "目标 Release 标签 (如 v1.0)"
        required: true
        default: "v1.0"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 计算版本号
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: PyInstaller 打包 (.app)
        run: python -m PyInstaller build.spec --noconfirm --clean
      - name: 生成 .dmg 磁盘镜像
        run: |
          hdiutil create -volname "SeisWave" \
            -srcfolder "dist/SeisWave.app" \
            -ov -format UDZO \
            "SeisWave-${{ steps.ver.outputs.tag }}-macos.dmg"
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: SeisWave-*-macos.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 计算版本号
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: PyInstaller 打包 (onedir)
        run: python -m PyInstaller build.spec --noconfirm --clean
      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y
      - name: 编译安装器 Setup.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: installer_out/SeisWave-*-windows-setup.exe
