name: Build Release Installers

# 在打 v* 标签时自动构建,或手动触发(workflow_dispatch)为指定已存在的 Release 补包
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "目标 Release 标签 (如 v1.0)"
        required: true
        default: "v1.0"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: PyInstaller 打包 (.app)
        run: python -m PyInstaller build.spec --noconfirm --clean
      - name: 压缩 .app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/SeisWave.app" "SeisWave-${{ github.event.inputs.tag || github.ref_name }}-macos.zip"
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: SeisWave-*-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: PyInstaller 打包 (.exe)
        run: python -m PyInstaller build.spec --noconfirm --clean
      - name: 压缩发布目录
        run: Compress-Archive -Path "dist/SeisWave/*" -DestinationPath "SeisWave-${{ github.event.inputs.tag || github.ref_name }}-windows.zip"
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: SeisWave-*-windows.zip
