[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 第三方导入链（matplotlib -> pyparsing）在 -W error 下会抛出已知弃用告警；
# 这里仅过滤该外部依赖告警，保留项目自身 warning-as-errors 行为。
filterwarnings =
    ignore::DeprecationWarning:matplotlib.*
    ignore::pyparsing.warnings.PyparsingDeprecationWarning
    ignore::UserWarning:matplotlib.*

[coverage:run]
source = seiswave
omit =
    */gui_backup_*
    */gui.bak/*
    */tests/*
    */benchmarks/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
